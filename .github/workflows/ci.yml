name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Ningún microdato en el repositorio
        working-directory: .
        run: |
          if [ -n "$(git ls-files data)" ]; then echo "Hay archivos de data/ en git:"; git ls-files data; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -f backend/Dockerfile -t observatorio-api .
      - name: Arrancar y probar /salud
        run: |
          docker run -d --name api -p 8000:8000 observatorio-api
          for i in $(seq 1 30); do curl -fs http://localhost:8000/salud && exit 0; sleep 2; done
          docker logs api; exit 1
      - name: La imagen no trae microdatos
        run: docker run --rm --entrypoint sh observatorio-api -c 'test ! -e /app/data'
